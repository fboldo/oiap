name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      # Source files that docs/scripts/sync-content.ts turns into pages.
      - "ARCHITECTURE.md"
      - "MATRIX.md"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - "packages/exporter-*/src/profile.ts"
      - "packages/cli/src/sync.ts"
      - "examples/*/README.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ARCHITECTURE.md"
      - "MATRIX.md"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - "packages/exporter-*/src/profile.ts"
      - "packages/cli/src/sync.ts"
      - "examples/*/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check links
        run: bun run check-links

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
